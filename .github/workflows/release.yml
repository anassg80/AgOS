name: Publish AgOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag GitHub de la release
        required: true
        default: v0.1.0
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-linux-images:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [lite, full]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso syslinux syslinux-utils \
            isolinux grub-pc-bin grub-efi-amd64-bin dosfstools mtools \
            ca-certificates curl git qemu-user-static
      - name: Build image
        run: |
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Create GitHub release
    needs: build-linux-images
    runs-on: ubuntu-24.04
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: find release-assets -type f -maxdepth 2 -print
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AgOS ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            AgOS Linux — quatre éditions.

            - AgOS Lite amd64 : anciens PC x86_64
            - AgOS Full amd64 : PC x86_64 courants
            - AgOS Lite arm64 : appareils ARM64 compatibles
            - AgOS Full arm64 : appareils ARM64 compatibles

            Vérifie chaque image avec son fichier SHA-256.
          files: release-assets/*
          generate_release_notes: true
