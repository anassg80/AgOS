name: AgOS Debian Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.5"
        required: true
        type: string
        default: v0.1.5
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        profile:
          - lite
          - full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian image build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            bash ca-certificates curl debootstrap dosfstools git \
            grub-efi-amd64-bin grub-pc-bin isolinux live-build mtools \
            squashfs-tools syslinux syslinux-utils xorriso
          command -v debootstrap
          command -v lb
          command -v xorriso
          command -v mksquashfs

      - name: Validate native architecture and source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          bash -n build.sh
          test -s "config/package-lists/agos-${{ matrix.profile }}.list.chroot"
          test -f config/hooks/00-setup-guest.chroot
          test -f config/hooks/90-profile-tuning.chroot

      - name: Build Debian AgOS image
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"

      - name: Verify generated ISO and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          image="dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          checksum="${image}.sha256"
          test -s "$image"
          test -s "$checksum"
          (cd dist && sha256sum -c "$(basename "$checksum")")

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Publish AgOS GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgOS-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f -name '*.iso.sha256' | wc -l)" -eq 4

      - name: Create release and upload files
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AgOS ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
