name: AgOS Debian Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.4"
        required: true
        type: string
        default: v0.1.4
  push:
    tags:
      - "v*"

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        profile:
          - lite
          - full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install complete Debian image build toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            debootstrap \
            dosfstools \
            git \
            grub-efi-amd64-bin \
            grub-pc-bin \
            isolinux \
            live-build \
            mtools \
            qemu-user-static \
            binfmt-support \
            squashfs-tools \
            syslinux \
            syslinux-utils \
            xorriso
          sudo update-binfmts --enable || true
          command -v debootstrap
          command -v lb
          command -v xorriso
          command -v mksquashfs
          test -x /usr/bin/qemu-aarch64-static

      - name: Validate source configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build.sh
          test -f "config/package-lists/agos-${{ matrix.profile }}.list.chroot"
          test -s "config/package-lists/agos-${{ matrix.profile }}.list.chroot"
          test -f config/hooks/00-setup-guest.chroot
          test -f config/hooks/90-profile-tuning.chroot

      - name: Build Debian AgOS image
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"

      - name: Verify generated ISO and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          image="dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          checksum="${image}.sha256"
          test -f "$image"
          test -s "$image"
          test -f "$checksum"
          test -s "$checksum"
          (cd dist && sha256sum -c "$(basename "$checksum")")

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Publish AgOS GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgOS-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f -name '*.iso.sha256' | wc -l)" -eq 4

      - name: Create release and upload ISO files
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AgOS ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/AgOS-lite-amd64.iso
            release-assets/AgOS-lite-amd64.iso.sha256
            release-assets/AgOS-full-amd64.iso
            release-assets/AgOS-full-amd64.iso.sha256
            release-assets/AgOS-lite-arm64.iso
            release-assets/AgOS-lite-arm64.iso.sha256
            release-assets/AgOS-full-arm64.iso
            release-assets/AgOS-full-arm64.iso.sha256
