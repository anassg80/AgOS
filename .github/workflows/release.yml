name: AgOS Debian ISO Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.8"
        required: true
        type: string
        default: v0.1.8
      artifact_run_id:
        description: "Existing Actions run ID with four ISO artifacts (leave empty to rebuild)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    if: ${{ inputs.artifact_run_id == '' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        profile:
          - lite
          - full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian ISO build dependencies
        shell: bash
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            ca-certificates \
            cpio \
            curl \
            debootstrap \
            debian-archive-keyring \
            dosfstools \
            file \
            git \
            grub-efi-amd64-bin \
            grub-pc-bin \
            isolinux \
            mtools \
            rsync \
            squashfs-tools \
            syslinux \
            syslinux-common \
            syslinux-utils \
            xorriso
          LIVE_BUILD_DEB=/tmp/live-build_20250505+deb13u1_all.deb
          curl -fsSLo "$LIVE_BUILD_DEB" https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          echo "58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  $LIVE_BUILD_DEB" | sha256sum --check
          sudo dpkg -i "$LIVE_BUILD_DEB"
          lb --version
          command -v debootstrap
          command -v lb
          command -v mksquashfs
          command -v xorriso
          command -v file

      - name: Validate repository configuration
        shell: bash
        run: |
          set -ex
          test -f build.sh
          chmod +x build.sh
          bash -n build.sh
          test -d config
          test -s "config/package-lists/agos-${{ matrix.profile }}.list.chroot"
          find config -maxdepth 4 -type f -print

      - name: Build Debian ISO
        shell: bash
        run: |
          set -ex
          sudo rm -rf "build/${{ matrix.arch }}-${{ matrix.profile }}"
          sudo mkdir -p dist
          sudo rm -f "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          sudo rm -f "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256"
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"
          sudo chown -R "$USER:$USER" dist
          test -s "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          test -s "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256"

      - name: Verify ISO checksum
        shell: bash
        run: |
          set -ex
          cd dist
          sha256sum -c "AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256"
          file "AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          ls -lh "AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Publish AgOS release
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Clean release runner
        shell: bash
        run: |
          set -ex
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          df -h

      - name: Install release utilities
        shell: bash
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y ca-certificates file

      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgOS-*
          path: downloaded-artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release files
        shell: bash
        run: |
          set -ex
          find downloaded-artifacts -type f -name '*.iso' -exec cp {} . \;
          find downloaded-artifacts -type f -name '*.sha256' -exec cp {} . \;
          for checksum in ./*.iso.sha256; do
            sed -E 's#  .*/(AgOS-[^/]+\.iso)$#  \1#' "$checksum" > "$checksum.tmp"
            mv "$checksum.tmp" "$checksum"
          done
          test "$(find . -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4
          ls -lh && file *.iso

      - name: Verify release ISO files
        shell: bash
        run: |
          set -ex
          ls -lh && file *.iso
          sha256sum -c ./AgOS-lite-amd64.iso.sha256
          sha256sum -c ./AgOS-full-amd64.iso.sha256
          sha256sum -c ./AgOS-lite-arm64.iso.sha256
          sha256sum -c ./AgOS-full-arm64.iso.sha256

      - name: Create GitHub release and upload ISO files
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AgOS ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./*.iso
