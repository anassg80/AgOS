name: Publish AgOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag GitHub pour la release"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build-linux-images:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [lite, full]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso syslinux syslinux-utils \
            isolinux grub-pc-bin grub-efi-amd64-bin grub-efi-arm64-bin dosfstools \
            mtools ca-certificates curl git qemu-user-static qemu-system-x86

      - name: Build ${{ matrix.profile }}-${{ matrix.arch }}
        run: |
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    needs: build-linux-images
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          find dist -type f \( -name '*.iso' -o -name '*.sha256' \) -print
          ls -R dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/**/*.iso
            dist/**/*.sha256
          generate_release_notes: true
