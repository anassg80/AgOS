name: Build AgOS editions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [lite, full]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso syslinux syslinux-utils \
            isolinux grub-pc-bin grub-efi-amd64-bin dosfstools mtools \
            ca-certificates curl git qemu-user-static
      - name: Build
        run: |
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256
