name: Build AgOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso syslinux syslinux-utils \
            isolinux grub-pc-bin grub-efi-amd64-bin grub-efi-arm64-bin dosfstools \
            mtools wget curl ca-certificates git imagemagick

      - name: Build AgOS amd64 ISO
        run: |
          chmod +x build.sh
          sudo ./build.sh amd64

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: agos-iso
          path: ./build/result/*.iso
