name: AgOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release, par exemple v0.1.1"
        required: true
        type: string
        default: v0.1.1

# Le build est exécuté dans Debian Bookworm, pas dans Ubuntu.
# Cela évite que live-build/debootstrap cherche ubuntu-keyring.
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    container:
      image: node:22-bookworm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [lite, full]

    steps:
      - name: Installer les outils du conteneur Debian
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates live-build debootstrap \
            squashfs-tools xorriso syslinux syslinux-utils isolinux \
            grub-pc-bin grub-efi-amd64-bin dosfstools mtools \
            qemu-user-static binfmt-support curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la configuration
        run: |
          bash -n build.sh
          test -f "config/package-lists/agos-${{ matrix.profile }}.list.chroot"
          grep -Rni --exclude-dir=.git ubuntu-keyring . && exit 1 || true

      - name: Construire l’image Debian AgOS
        run: |
          chmod +x build.sh
          ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"

      - name: Vérifier l’image et son hash
        run: |
          IMAGE="dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          HASH="${IMAGE}.sha256"
          test -s "$IMAGE"
          test -s "$HASH"
          (cd "$(dirname "$IMAGE")" && sha256sum -c "$(basename "$HASH")")

      - name: Conserver l’image comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Publier la GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Télécharger les images
        uses: actions/download-artifact@v4
        with:
          pattern: AgOS-*
          path: release-assets
          merge-multiple: true

      - name: Vérifier les quatre images
        run: |
          set -Eeuo pipefail
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -type f -name '*.iso' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: AgOS ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            AgOS Linux — quatre éditions.
            Les fichiers .sha256 permettent de vérifier les images.
          files: release-assets/*
