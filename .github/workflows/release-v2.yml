name: AgOS Release (new)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release, par exemple v0.1.1"
        required: true
        type: string
        default: v0.1.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [lite, full]

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            syslinux \
            syslinux-utils \
            isolinux \
            grub-pc-bin \
            grub-efi-amd64-bin \
            dosfstools \
            mtools \
            qemu-user-static \
            binfmt-support \
            ca-certificates \
            curl \
            git

      - name: Vérifier les scripts
        run: |
          bash -n build.sh
          bash -n config/hooks/00-setup-guest.chroot
          bash -n config/hooks/90-profile-tuning.chroot

      - name: Construire l’image
        run: |
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"

      - name: Vérifier les fichiers produits
        run: |
          test -s "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          test -s "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256"
          sha256sum -c "dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256"

      - name: Publier l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Créer la GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Télécharger les quatre artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgOS-*
          path: release-assets
          merge-multiple: true

      - name: Vérifier les quatre images
        run: |
          set -eux
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -name '*.iso' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AgOS ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AgOS

            Quatre éditions Linux sont disponibles :
            - AgOS Lite amd64
            - AgOS Full amd64
            - AgOS Lite arm64
            - AgOS Full arm64

            Vérifiez chaque image avec son fichier `.sha256`.
          files: release-assets/*
