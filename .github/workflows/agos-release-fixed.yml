name: AgOS Release - fixed ARM64 build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Nouveau tag de release"
        required: true
        type: string
        default: v0.1.2

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build ${{ matrix.profile }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [lite, full]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable QEMU for foreign ARM64 builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            syslinux syslinux-utils isolinux grub-pc-bin \
            grub-efi-amd64-bin dosfstools mtools \
            qemu-user-static binfmt-support ca-certificates curl git
          sudo update-binfmts --enable || true
          test -x /usr/bin/qemu-aarch64-static

      - name: Validate configuration
        run: |
          bash -n build.sh
          test -f "config/package-lists/agos-${{ matrix.profile }}.list.chroot"

      - name: Build image
        run: |
          chmod +x build.sh
          sudo ./build.sh "${{ matrix.arch }}" "${{ matrix.profile }}"

      - name: Verify image and checksum
        run: |
          image="dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso"
          test -s "$image"
          test -s "$image.sha256"
          (cd dist && sha256sum -c "$(basename "$image").sha256")

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: AgOS-${{ matrix.profile }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso
            dist/AgOS-${{ matrix.profile }}-${{ matrix.arch }}.iso.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AgOS-*
          path: release-assets
          merge-multiple: true
      - name: Check release assets
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.iso' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: AgOS ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
